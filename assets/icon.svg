<?xml version="1.0" encoding="UTF-8"?>
<!--
  PS2 Mod Manager — Application Icon
  A stylised PlayStation 2 DualShock controller on a dark rounded background.
  Colours match the app's dark theme accent palette (#e94560 / #1a1a2e / #0f3460).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg_grad" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#22274a"/>
      <stop offset="100%" stop-color="#0c0e1f"/>
    </radialGradient>
    <radialGradient id="body_grad" cx="50%" cy="40%" r="60%">
      <stop offset="0%"  stop-color="#2a3060"/>
      <stop offset="100%" stop-color="#16213e"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Background circle ───────────────────────────────────────── -->
  <rect x="4" y="4" width="248" height="248" rx="48" ry="48" fill="url(#bg_grad)"/>

  <!-- ── Controller body ─────────────────────────────────────────── -->
  <!-- Main body — wide trapezoid shape characteristic of DualShock -->
  <g filter="url(#shadow)">
    <!-- Central body -->
    <path d="M 58 108
             C 52 100, 40 90, 32 130
             C 26 155, 28 178, 42 192
             C 56 206, 76 208, 90 200
             C 104 192, 108 180, 128 180
             C 148 180, 152 192, 166 200
             C 180 208, 200 206, 214 192
             C 228 178, 230 155, 224 130
             C 216 90, 204 100, 198 108
             C 184 104, 168 100, 128 100
             C 88 100, 72 104, 58 108 Z"
          fill="url(#body_grad)" stroke="#0f3460" stroke-width="2"/>

    <!-- Left grip -->
    <path d="M 42 192 C 30 210, 28 230, 46 238 C 60 244, 78 240, 90 228
             C 100 218, 104 206, 90 200 C 76 208, 56 206, 42 192 Z"
          fill="url(#body_grad)" stroke="#0f3460" stroke-width="2"/>

    <!-- Right grip -->
    <path d="M 214 192 C 226 210, 228 230, 210 238 C 196 244, 178 240, 166 228
             C 156 218, 152 206, 166 200 C 180 208, 200 206, 214 192 Z"
          fill="url(#body_grad)" stroke="#0f3460" stroke-width="2"/>
  </g>

  <!-- ── D-Pad (left side) ────────────────────────────────────────── -->
  <g fill="#e94560" opacity="0.9">
    <!-- Horizontal bar -->
    <rect x="60" y="134" width="38" height="14" rx="3"/>
    <!-- Vertical bar -->
    <rect x="72" y="122" width="14" height="38" rx="3"/>
  </g>

  <!-- ── Face buttons (right side) ───────────────────────────────── -->
  <!-- Triangle (green) -->
  <circle cx="183" cy="124" r="9" fill="none" stroke="#00b060" stroke-width="2.5"/>
  <text x="183" y="128" text-anchor="middle" font-family="sans-serif" font-size="10"
        font-weight="bold" fill="#00b060">▲</text>

  <!-- Circle (red/accent) -->
  <circle cx="198" cy="140" r="9" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <circle cx="198" cy="140" r="5" fill="#e94560"/>

  <!-- Cross (blue/X) -->
  <circle cx="168" cy="140" r="9" fill="none" stroke="#5090e0" stroke-width="2.5"/>
  <text x="168" y="144.5" text-anchor="middle" font-family="sans-serif" font-size="11"
        font-weight="bold" fill="#5090e0">✕</text>

  <!-- Square (pink) -->
  <circle cx="183" cy="156" r="9" fill="none" stroke="#e070c0" stroke-width="2.5"/>
  <rect x="178" y="151" width="10" height="10" rx="2" fill="#e070c0" opacity="0.85"/>

  <!-- ── Analog sticks ────────────────────────────────────────────── -->
  <!-- Left analog -->
  <circle cx="100" cy="154" r="16" fill="#0f1830" stroke="#2a3060" stroke-width="2"/>
  <circle cx="100" cy="154" r="10" fill="#1e2c50"/>
  <circle cx="100" cy="154" r="5" fill="#e94560" opacity="0.6"/>

  <!-- Right analog -->
  <circle cx="156" cy="154" r="16" fill="#0f1830" stroke="#2a3060" stroke-width="2"/>
  <circle cx="156" cy="154" r="10" fill="#1e2c50"/>
  <circle cx="156" cy="154" r="5" fill="#e94560" opacity="0.6"/>

  <!-- ── Start / Select ───────────────────────────────────────────── -->
  <rect x="120" y="118" width="16" height="8" rx="4" fill="#2a3060" stroke="#6070a0" stroke-width="1"/>
  <text x="128" y="125" text-anchor="middle" font-family="sans-serif" font-size="5"
        fill="#9090c0">START</text>

  <rect x="120" y="132" width="16" height="8" rx="4" fill="#2a3060" stroke="#6070a0" stroke-width="1"/>
  <text x="128" y="139" text-anchor="middle" font-family="sans-serif" font-size="5"
        fill="#9090c0">SEL</text>

  <!-- ── L/R shoulder buttons ────────────────────────────────────── -->
  <rect x="52" y="98" width="40" height="12" rx="6" fill="#0f2a50" stroke="#2a3060" stroke-width="1.5"/>
  <text x="72" y="108" text-anchor="middle" font-family="sans-serif" font-size="9"
        font-weight="bold" fill="#6090d0">L1</text>

  <rect x="164" y="98" width="40" height="12" rx="6" fill="#0f2a50" stroke="#2a3060" stroke-width="1.5"/>
  <text x="184" y="108" text-anchor="middle" font-family="sans-serif" font-size="9"
        font-weight="bold" fill="#6090d0">R1</text>

  <!-- ── Small accent glow line ───────────────────────────────────── -->
  <line x1="96" y1="102" x2="160" y2="102" stroke="#e94560" stroke-width="2"
        stroke-linecap="round" opacity="0.5"/>
</svg>
