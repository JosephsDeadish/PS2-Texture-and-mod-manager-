name: Build — Windows EXE

# Triggers:
#  - Push of a version tag (v1.0.0, v2.1.3 …)
#  - Manual trigger from Actions tab
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # Required for creating GitHub Releases

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. Check out source
      # ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────
      # 2. Set up Python
      # ────────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ────────────────────────────────────────────────────────────────
      # 3. Install dependencies
      # ────────────────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ────────────────────────────────────────────────────────────────
      # 4. Generate PNG + ICO icon files
      # ────────────────────────────────────────────────────────────────
      - name: Generate icon files
        run: python assets/generate_icons.py

      # ────────────────────────────────────────────────────────────────
      # 5. Build with PyInstaller
      # ────────────────────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: pyinstaller PS2ModManager.spec --noconfirm

      # ────────────────────────────────────────────────────────────────
      # 6. Package the dist folder into a ZIP
      # ────────────────────────────────────────────────────────────────
      - name: Create distribution ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PS2ModManager\* `
                           -DestinationPath dist\PS2ModManager-Windows.zip

      # ────────────────────────────────────────────────────────────────
      # 7. Upload build artifact (always available in Actions tab)
      # ────────────────────────────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS2ModManager-Windows
          path: dist/PS2ModManager-Windows.zip
          retention-days: 30

      # ────────────────────────────────────────────────────────────────
      # 8. Create a GitHub Release (only on version tags)
      # ────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PS2 Mod Manager ${{ github.ref_name }}
          body: |
            ## PS2 Mod Manager ${{ github.ref_name }}

            ### Installation (Windows)
            1. Download `PS2ModManager-Windows.zip` below
            2. Extract to any folder
            3. Double-click `PS2ModManager.exe` to launch

            ### Features
            - Manage texture packs, PNACH patches, cover art, memory cards, and cheats
            - Import ZIP/7z archives automatically extracted on import
            - Conflict detection with one-click resolution
            - Cover art download from GameTDB by game serial
            - Setup wizard auto-detects your PCSX2 installation

            ---
            ❤ [Support the developer on Patreon](https://www.patreon.com/c/DeadOnTheInside)
          files: dist/PS2ModManager-Windows.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
